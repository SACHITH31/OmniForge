name: Validate
on:
  push:
    branches: [main, feat/android-foundation]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Check release metadata contract
        shell: bash
        run: |
          tag="v$(node -p "require('./app.json').expo.version")"
          node scripts/release-preflight.cjs "$tag"
          if node scripts/release-preflight.cjs "v999.999.999"; then
            echo "Expected a mismatched tag to fail" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npx expo export --platform android
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0 ndk;27.1.12297006'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CRBA.apk
      - name: Verify bundled JavaScript
        run: unzip -Z1 CRBA.apk | grep -Fx 'assets/index.android.bundle'
      - name: Verify APK identity and record development provenance
        shell: bash
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs CRBA.apk | tee apk-signature.txt
          "$tools/aapt2" dump badging CRBA.apk > apk-manifest.txt
          grep -F "package: name='com.omniforge.app'" apk-manifest.txt
          version="$(node -p "require('./app.json').expo.version")"
          grep -F "versionName='$version'" apk-manifest.txt
          version_code="$(node -p "require('./app.json').expo.android.versionCode")"
          grep -F "versionCode='$version_code'" apk-manifest.txt
          git rev-parse HEAD > source-commit.txt
          sha256sum CRBA.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CRBA
          path: |
            CRBA.apk
            SHA256SUMS.txt
            apk-manifest.txt
            apk-signature.txt
            source-commit.txt
          if-no-files-found: error
  android-smoke:
    needs: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CRBA
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Build test receiver
        run: bash scripts/android-receiver/build.sh "$RUNNER_TEMP/receiver.apk"
      - name: Launch standalone APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install $RUNNER_TEMP/receiver.apk
            adb install CRBA.apk
            adb shell am start -W -n com.omniforge.app/.MainActivity
            sleep 15
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -F 'YOUR OFFLINE WORKSPACE'
            python3 scripts/test_android_results.py
