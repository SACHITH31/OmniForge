name: Validate
on:
  push:
    branches: [main, feat/android-foundation]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npx expo export --platform android
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0 ndk;27.1.12297006'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CRBA.apk
      - name: Verify bundled JavaScript
        run: unzip -Z1 CRBA.apk | grep -Fx 'assets/index.android.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: CRBA
          path: CRBA.apk
          if-no-files-found: error
  android-smoke:
    needs: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CRBA
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch standalone APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install CRBA.apk
            adb shell am start -W -n com.omniforge.app/.MainActivity
            sleep 15
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -F 'YOUR OFFLINE WORKSPACE'
            python3 scripts/test_android_results.py
